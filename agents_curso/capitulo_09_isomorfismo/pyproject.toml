[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isomorphism-agent"
version = "1.0.0"
description = "Statistical agent implementing the Wald-MDP structural isomorphism (Cap. 9)"
requires-python = ">=3.10"
authors = [{name = "Isomorphism Agent Team"}]
license = {text = "MIT"}
readme = "README.md"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "langgraph>=0.2",
  "typing_extensions>=4.7",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov"]
notebook = ["jupyter", "nbconvert"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
