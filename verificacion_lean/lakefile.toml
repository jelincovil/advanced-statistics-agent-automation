// Solo portabilidad/CI: el mecanismo canónico local es `verificar.sh` con el
// LEAN_PATH del entorno (Mathlib precompilada; /opt/mathlib es read-only).
// En otra máquina: `lake exe cache get && lake build`.
name = "verificacionLean"
version = "0.1.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"  // debe coincidir con la Mathlib precompilada local

[[lean_lib]]
name = "Book"
globs = ["Book.+"]
